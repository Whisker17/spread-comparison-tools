name: backend

on:
  push:
    paths:
      - "spread_compare/**"
      - "tests/**"
      - "config/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "spread_compare/**"
      - "tests/**"
      - "config/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy (strict via pyproject)
        run: uv run mypy
      - name: Pytest (offline; skips @pytest.mark.live)
        run: uv run pytest
