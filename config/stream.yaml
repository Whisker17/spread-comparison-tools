# WebSocket push stream for the dashboard (WHI-848).
# Unvalidated defaults pending DESIGN.md §2 — starting points only.
#
# Clients subscribe once; the hub coalesces store/live package rebuilds and
# pushes snapshot-then-delta frames. N viewers share one collect per filter
# key (aggregator single-flight + response cache still apply for live venues).

# Batch window: max push rate ≈ 1000/coalesce_interval_ms frames per client.
# 400 ms ⇒ ≤ 2.5 frames/s even if a venue updates every 50 ms.
coalesce_interval_ms: 400

# Application-level heartbeat (JSON type=heartbeat). Clients treat silence
# longer than client_liveness_timeout_sec as a dead connection (TCP can hang
# without a close frame — onclose alone is not sufficient).
heartbeat_interval_sec: 15.0
client_liveness_timeout_sec: 45.0

# Concurrent connected browsers (cap server fan-out work).
max_clients: 50

# Per-client subscription breadth caps (reject oversize subscribe).
max_assets_per_client: 20
max_venues_per_client: 40

# Outbound queue depth per client. When full, drop the oldest pending frame
# rather than unbounded memory growth (slow client backpressure).
#
# Invariant (validated in StreamSettings): max_queue_depth >= max_assets_per_client.
# The hub enqueues **one frame per subscribed asset per coalesce tick**. If the
# queue is shallower than the asset cap, a single tick can never fit even when
# empty — and pre-WHI-888 that interacted with a full-baseline wipe on overflow
# to pin multi-asset pages (e.g. /stocks with 14 underlyings) in a permanent
# full-snapshot storm. Overflow still only invalidates the dropped frame's
# asset; this floor just keeps one full tick structural.
#
# No stream_overloaded warning frame: structural overload is rejected at config
# load; transient backpressure is per-asset resnapshot only (WHI-888).
max_queue_depth: 20
