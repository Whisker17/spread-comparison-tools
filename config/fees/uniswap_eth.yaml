# Uniswap v3 (Ethereum) fee schedule (WHI-812).
# LP fee is embedded in quoter prices — never added to trading_component_bps.
# lp_fee_tiers_bps are informational (pool fee tier options in bps).
# gas_estimate_usd is a static display fallback; live quotes use quoter gasEstimate.
venue: uniswap_eth
schedules:
  - instrument_type: amm_pool
    maker_bps: null
    taker_bps: null
    default_tier: pool
    lp_fee_tiers_bps:
      - "1"    # 0.01% (fee unit 100)
      - "5"    # 0.05% (fee unit 500)
      - "30"   # 0.30% (fee unit 3000)
      - "100"  # 1.00% (fee unit 10000)
    gas_estimate_usd: "8"
    funding_model: none
    fee_embedded_in_quote: true
    source_urls:
      - https://support.uniswap.org/hc/en-us/articles/20904283758349-What-are-fee-tiers
      - https://developers.uniswap.org/docs/get-started/concepts/fees
    updated_at: "2026-08-03T00:00:00Z"
