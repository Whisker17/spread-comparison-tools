# ApeX Omni perp fee schedule (WHI-812).
# Phase 1 uses Level 1 (default non-VIP) rates. Higher VIP levels for display.
# Funding settles hourly on the hour (UTC) → funding_model: perp_continuous.
venue: apex
schedules:
  - instrument_type: perp
    maker_bps: "2"
    taker_bps: "5"
    default_tier: default_taker
    funding_model: perp_continuous
    fee_embedded_in_quote: false
    tiers:
      - name: default_taker
        maker_bps: "2"
        taker_bps: "5"
        volume_requirement: "< $5M 14d volume (or <= 25,000 APEX/esAPEX)"
      - name: level2
        maker_bps: "1.5"
        taker_bps: "4.5"
        volume_requirement: ">= $5M 14d or >= 25,000 APEX/esAPEX"
      - name: level3
        maker_bps: "1"
        taker_bps: "4"
        volume_requirement: ">= $25M 14d or >= 100,000 APEX/esAPEX"
      - name: level4
        maker_bps: "0.5"
        taker_bps: "3.5"
        volume_requirement: ">= $100M 14d or >= 250,000 APEX/esAPEX"
      - name: level5
        maker_bps: "0"
        taker_bps: "3"
        volume_requirement: ">= $500M 14d"
    source_urls:
      - https://apex-pro.gitbook.io/apex-pro/apex-omni/trading-and-funding-fees
      - https://omni.apex.exchange/tradingFeeTier
    updated_at: "2026-08-03T00:00:00Z"
