# Lighter perp fee schedule (WHI-812).
# Phase 1 default = Standard Account (0 maker / 0 taker). This is the published
# default account type, not a temporary promo — Premium is opt-in.
# Premium / Plus tiers listed for display only.
venue: lighter
schedules:
  - instrument_type: perp
    maker_bps: "0"
    taker_bps: "0"
    default_tier: default_taker
    funding_model: perp_continuous
    fee_embedded_in_quote: false
    tiers:
      - name: default_taker
        maker_bps: "0"
        taker_bps: "0"
        volume_requirement: "Standard Account (default)"
      - name: premium_0
        maker_bps: "0.4"
        taker_bps: "2.8"
        volume_requirement: "Premium Account, 0 staked LIT"
      - name: premium_1000
        maker_bps: "0.39"
        taker_bps: "2.73"
        volume_requirement: "Premium Account, >= 1,000 staked LIT"
      - name: premium_10000
        maker_bps: "0.36"
        taker_bps: "2.52"
        volume_requirement: "Premium Account, >= 10,000 staked LIT"
      - name: plus
        maker_bps: "0.5"
        taker_bps: "0.5"
        volume_requirement: "Plus Account (0.5 bps maker/taker)"
    source_urls:
      - https://docs.lighter.xyz/trading/trading-fees
      - https://docs.lighter.xyz/trading/funding
    updated_at: "2026-08-03T00:00:00Z"
