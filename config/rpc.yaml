# EVM JSON-RPC client budget (WHI-842).
# Defaults are **unvalidated** pending docs/DESIGN.md §2 — conservative starting
# points for free public endpoints (mainnet.base.org / publicnode / bsc-dataseed).
# Keyed provider tiers raise rps via config only; secrets stay in .env.
#
# Token bucket: capacity = rps, window = window_sec → burst of `rps` then refill
# at rps/window_sec tokens per second. Shared per endpoint URL (not per adapter).

default_rps: 5
window_sec: 1.0
# Total attempts for HTTP 429 / provider rate-limit JSON-RPC errors (includes first).
max_attempts: 3
backoff_start_sec: 0.5
# Cap for exponential backoff (and Retry-After floor below).
backoff_max_sec: 8.0
retry_after_floor_sec: 0.05
# eth_gasPrice is chain-level; short TTL so a snapshot's many legs share one fetch.
gas_price_cache_ttl_sec: 15.0

# Optional per-env overrides (env var name → partial budget).
# Keys must match adapter ``rpc_env`` values (ETH_RPC_URL / BASE_RPC_URL / BSC_RPC_URL);
# unknown keys fail fast at load.
chains:
  ETH_RPC_URL:
    rps: 5
  BASE_RPC_URL:
    rps: 5
  BSC_RPC_URL:
    rps: 5
