# WebSocket orderbook ingest (WHI-847 / WHI-855).
# Defaults are **unvalidated** pending docs/DESIGN.md §2 — engineering starting points only.
# YAML is the sole source of these values (no silent Python Field defaults).

enabled: true

# Max age of a local book before serve returns error (not a stale price).
max_book_age_sec: 5.0

# Reconnect backoff (seconds) with jitter; doubles until max.
reconnect_min_sec: 1.0
reconnect_max_sec: 30.0

# Lighter gap recovery: min seconds between channel resubscribes (WHI-855).
# Resync is re-subscribe (server snapshot carries a real nonce) — not REST+fake nonce.
lighter_min_resync_interval_sec: 2.0

# Fast mid path: poll Binance USDM premiumIndex at this interval (1 Hz verified).
fast_mid_poll_interval_sec: 1.0

# Subscribe batch sizes (args per op). Venue-specific — Bybit spot rejects >10;
# ApeX multi-arg returns "handler not found" so chunk=1 (WHI-855 live probes).
bybit_spot_subscribe_chunk: 10
bybit_linear_subscribe_chunk: 20
apex_subscribe_chunk: 1

# Binance spot REST resync throttle (depth limit=1000 → weight 50; IP 6000/min).
# Unthrottled storms risk 429/418 IP bans that also kill the REST fallback (WHI-855).
binance_spot_min_resync_interval_sec: 2.0
binance_spot_resync_weight: 50
binance_spot_resync_weight_budget_per_min: 1500

# Application-level heartbeats. Hyperliquid ignores transport pings → disable
# them and send {"method":"ping"} instead. ApeX *sends* {"op":"ping"} and
# expects {"op":"pong"} (handled in the feed, not a client timer).
hyperliquid_app_ping_interval_sec: 20.0
hyperliquid_transport_ping: false

# Venue streams: enabled independently; disabled → REST-only for that stream.
streams:
  binance_spot: true
  binance_futures: true
  bybit_spot: true
  bybit_linear: true
  hyperliquid: true
  lighter: true
  apex: true
