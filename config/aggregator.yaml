# Quote aggregator (WHI-807 / WHI-836).
# Defaults are **unvalidated** pending docs/DESIGN.md §2 — engineering starting points only.

# Default per-venue asyncio timeout around adapter.get_quote / get_orderbook_spread.
venue_timeout_sec: 3.0

# Per-class overrides for multi-round-trip / shared-limiter venues (WHI-836).
# Classes absent here use venue_timeout_sec. Do not raise the global default
# just to fit the slowest class — that delays every CEX/perp response.
venue_timeout_by_class:
  # WHI-838: five tiers × 3 Solana props × 2 sides can queue ~30 Jupiter
  # acquires per asset (blue-chips matrix fan-out). Keyed bucket capacity 10/s
  # (config/jupiter.yaml) → ~3s pure limiter drain; keep headroom for RTT/429
  # backoff so the tail does not classify as timeout (WHI-836 class).
  prop_amm: 12.0
  amm_dex: 6.0

# Response cache TTL. Frontend section poll interval is 30s (see
# frontend/src/config/sections/* pollIntervalMs). TTL must exceed the poll
# interval so a second viewer or a re-render within a poll cycle reuses a
# snapshot (WHI-844; raised from 20s which was always a cold miss at 30s poll).
# Trade-off: displayed data can be up to TTL seconds old — UI must keep
# showing snapshot_id / timestamp prominently. Do not raise so far that the
# dashboard stops feeling "live" (stay near one poll + small headroom).
response_cache_ttl_sec: 35.0
