# HTTP API surface tunables (WHI-808 CORS for local Next.js dashboard).
# Unvalidated defaults pending DESIGN.md §2 — override via api.local.yaml.
#
# Browser origins allowed to call the API (CORS). No trailing slashes.
cors_origins:
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"

# Per-client min interval for POST /simulate (WHI-814). Protects the shared
# Jupiter keyless ~0.5 RPS budget when a request fans out to three Solana props.
# Set to 0 to disable the guard (tests / private LAN).
simulate_min_interval_sec: 2.0
