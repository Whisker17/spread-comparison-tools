# HTTP API surface tunables (WHI-808 CORS for local Next.js dashboard).
# Unvalidated defaults pending DESIGN.md §2.
#
# Production values live HERE in the committed file (WHI-849) — not in an
# untracked api.local.yaml. *.local.yaml is for laptop-only experiments;
# deploy never ships it. Add a production browser origin to this list and
# commit it; do not put it only on the host.
#
# Browser origins allowed to call the API (CORS). No trailing slashes.
cors_origins:
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"
  - "http://localhost:3001"
  - "http://127.0.0.1:3001"
  - "http://localhost:3002"
  - "http://127.0.0.1:3002"

# Per-client min interval for POST /simulate (WHI-814). Protects the shared
# Jupiter keyless ~0.5 RPS budget when a request fans out to three Solana props.
# Set to 0 to disable the guard (tests / private LAN).
simulate_min_interval_sec: 2.0
