# Pull-only background poller (WHI-846 / WHI-864).
# Defaults are **unvalidated** pending docs/DESIGN.md §2 — engineering starting
# points from VPS measurements 2026-08-05. Override with poller.local.yaml.

# Master switch. When false, GET /quotes keeps the live fan-out for all classes.
enabled: true

# Venue classes served exclusively from the in-memory store on GET /quotes.
# Orderbook classes (cex / perp_dex) stay on the live path (WS + REST).
poller_served_classes:
  - amm_dex
  - prop_amm

# Per-upstream sweep groups. Membership is resolved at runtime from venue
# slug / class (see spread_compare.poller.group_for_venue). Each group owns
# its pacing and sampled notional tiers so Jupiter can stay sparse while
# free orderbook-side AMM / Kyber sweeps keep the full §4.1 matrix.
#
# interval_sec: must exceed worst-case sweep wall time with headroom for
# retries and /simulate's share of the shared limiter. Sweeps never overlap
# within a group (in-flight skip is counted and visible on /health).
groups:
  jupiter:
    # Sampled matrix (WHI-864 / WHI-865): keep both sides (round-trip /
    # half-spread is the basis-immune metric vs perps); cut tiers, not sides.
    #
    # Budget arithmetic (3 prop venues × 3 assets × N tiers × 2 sides = 18N):
    # | Sampled matrix                 | Calls | Time @ 0.6 RPS | Fits 120 s? |
    # | 5 tiers × 2 sides (full §4.1)  | 90    | 150 s          | no (overlap)|
    # | 4 tiers × 2 sides (+$100k)     | 72    | 120 s          | exact, 0s   |
    # | 3 tiers × 2 sides (chosen)     | 54    | 90 s           | yes, 30 s   |
    # | 5 tiers × buy only             | 45    | 75 s           | yes — but   |
    # |                                |       |                | loses RT    |
    #
    # Anchors $100 / $1k / $10k (WHI-865): product cares about the small-to-
    # mid band ($100 from WHI-838; $1k dashboard default; $10k most-read
    # size). Keep both sides so round-trip / half-spread stays basis-immune
    # vs perps. Drop $1M from the sample set — WHI-865 production table
    # showed Solana props at $1M as no_quote / excessive_impact, so the
    # spend bought little comparable signal; $100k stays unsampled under
    # the 3-tier budget (status=not_sampled on those cells).
    #
    # Unsampled tiers return status=not_sampled (not error) so the UI and
    # error-rate / WHI-819 signals stay honest. Orderbook venues still
    # price every §4.1 tier from the WS book; the gap is prop-AMM-only.
    #
    # Keyed (production: JUPITER_API_KEY set): sustained 1 RPS, budget_share
    # 0.6 → 0.6 RPS → 54/0.6 ≈ 90 s start-spacing. interval_sec = 120s ≈
    # 1.33× that (RTT + 429 backoff + /simulate's remaining 0.4 RPS).
    # Keyless worst case is 0.5 RPS × 0.6 = 0.3 RPS → ~180 s; without a key
    # expect overrun skips and quote_stale until a key is configured — do
    # not size the keyed path for that case.
    notionals_usd:
      - 100
      - 1000
      - 10000
    interval_sec: 120.0
    budget_share: 0.6
    # 1.25× interval so a just-finished row stays §5.2 best until the next
    # sample lands under normal (keyed) pacing.
    max_quote_age_for_best_sec: 150.0
    max_stale_sec: 240.0
  kyber:
    # Unpublished limit (WHI-797 §7.2); pace conservatively — production saw
    # KyberSwap 429 backoff loops under per-request fan-out.
    # Full §4.1 matrix ≈100 calls at 2 RPS → ~50 s start-spacing;
    # interval_sec = 60s = 1.2× headroom.
    notionals_usd:
      - 100
      - 1000
      - 10000
      - 100000
      - 1000000
    interval_sec: 60.0
    max_rps: 2.0
    max_quote_age_for_best_sec: 120.0
    max_stale_sec: 180.0
  rpc:
    # On-chain quoter eth_call budget is shared per RPC endpoint (WHI-842).
    # WHI-891: +7 Phase-A Pancake bStocks (WHI-890 §8). Naive linear upper
    # bound at 5 RPS ≈ 34 s start-spacing (was ~20 s). Named offset: raise
    # interval_sec 30 → 45 so wall-clock still fits with ~11 s headroom
    # (was 10 s at 20/30; not a 1.5× headroom keep). Age/stale gates scale
    # with the new interval (2× / 4×). Multicall3 is sub-linear so real wall
    # is below the naive bound. Tessera/Kyber and Jupiter loads unchanged
    # (no Tessera expansion; Solana xStock props all absent_no_route).
    notionals_usd:
      - 100
      - 1000
      - 10000
      - 100000
      - 1000000
    interval_sec: 45.0
    max_rps: 5.0
    max_quote_age_for_best_sec: 90.0
    max_stale_sec: 180.0
