[project]
name = "spread-comparison-tools"
version = "0.1.0"
description = "Tools and research for comparing execution quality / spreads across venues (CEX, public DEX, prop AMM) on Solana, Base and BSC."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spread_compare"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--strict-markers"
markers = [
    "live: hits real upstream APIs; requires network and credentials",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["main.py", "spread_compare"]
plugins = ["pydantic.mypy"]
